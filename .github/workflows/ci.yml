# CI per docs/architecture.md D3: GitHub-hosted Windows runners build and run
# unit and provider tests, then the end-to-end suite runner-direct (the e2e
# job below).
#
# The nvda/ submodule is reference material only and is deliberately not
# checked out here (actions/checkout does not fetch submodules by default).
# The third_party/espeak-ng submodule is fetched by each job: eSpeak NG is
# built from it as part of the workspace.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch eSpeak NG's source
        run: git submodule update --init --depth 1 third_party/espeak-ng
      # rust-toolchain.toml pins the toolchain, installed on the first cargo
      # invocation; everything builds for the runner's own architecture.
      - uses: Swatinem/rust-cache@v2
      # The GUI's static wxWidgets build (crates/verbatim-gui/build/wx.rs)
      # goes to a fixed directory per version and architecture; caching it
      # spares every run the build. The key follows the recipe file.
      - name: Point the wxWidgets build at a cached directory
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERBATIM_WX_DIR=$env:USERPROFILE\verbatim-wx"
      - uses: actions/cache@v4
        with:
          path: ~/verbatim-wx
          key: wxwidgets-3.3.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/verbatim-gui/build/wx.rs') }}
      # `cargo xtask ci` checks the workspace-hack crate with cargo-hakari.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari
      - name: Run CI checks
        run: cargo xtask ci

  # The same checks on an ARM64 runner: nothing names a target, so this
  # job builds and tests ARM64, as `ci` does x64.
  ci-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Fetch eSpeak NG's source
        run: git submodule update --init --depth 1 third_party/espeak-ng
      - name: Install rustup if the image lacks it
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain none --profile minimal
            Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.cargo\bin"
          }
      - uses: Swatinem/rust-cache@v2
      # The GUI's static wxWidgets build (crates/verbatim-gui/build/wx.rs)
      # goes to a fixed directory per version and architecture; caching it
      # spares every run the build. The key follows the recipe file.
      - name: Point the wxWidgets build at a cached directory
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERBATIM_WX_DIR=$env:USERPROFILE\verbatim-wx"
      - uses: actions/cache@v4
        with:
          path: ~/verbatim-wx
          key: wxwidgets-3.3.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/verbatim-gui/build/wx.rs') }}
      # `cargo xtask ci` checks the workspace-hack crate with cargo-hakari.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari
      - name: Run CI checks
        run: cargo xtask ci

  # Milestone M2's runner-direct E2E suite (docs/roadmap.md): builds the
  # debug binaries the suite drives, starts verbatim-agent.exe bound to
  # loopback, points crates/verbatim-e2e at it, and runs the suite serially
  # (one live Verbatim at a time, per crates/verbatim-e2e's Scenario type).
  # A separate job from `ci` so a live-suite failure is easy to tell apart
  # from a build or lint failure; GitHub's Windows runners execute jobs in
  # an interactive session, which is what lets SendInput-based key
  # injection and real window focus work here.
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch eSpeak NG's source
        run: git submodule update --init --depth 1 third_party/espeak-ng
      - uses: Swatinem/rust-cache@v2
      # The GUI's static wxWidgets build (crates/verbatim-gui/build/wx.rs)
      # goes to a fixed directory per version and architecture; caching it
      # spares every run the build. The key follows the recipe file.
      - name: Point the wxWidgets build at a cached directory
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERBATIM_WX_DIR=$env:USERPROFILE\verbatim-wx"
      - uses: actions/cache@v4
        with:
          path: ~/verbatim-wx
          key: wxwidgets-3.3.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/verbatim-gui/build/wx.rs') }}
      # mockapp is the scripted application the spelling errors scenario
      # reads, since the runner's classic Notepad has no spell checker.
      - name: Build Verbatim, its child processes, the agent, and mockapp (debug)
        run: cargo build -p verbatim-app -p verbatim-agent -p verbatim-outpost -p verbatim-synth-host -p mockapp
      # Every scenario is recorded, video and Verbatim's own audio, when
      # ffmpeg can be started (crates/verbatim-e2e/src/recording.rs).
      - name: Make sure ffmpeg is installed
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          ffmpeg -version | Select-Object -First 1
      # The agent is started in the same step as the suite: GitHub's Windows
      # runner ends the processes a step started when that step finishes, so
      # an agent started in a step of its own was gone (connection refused)
      # by the time the suite ran. NVDA's system tests start NVDA inside
      # their test step for the same reason.
      # Windows Terminal, so the terminal scenarios that prefer it use it
      # here as they do on Windows 11, rather than falling back to the
      # console host (docs/tooling.md). The release's preinstall kit holds
      # the bundle and its one dependency, the Microsoft.UI.Xaml.2.8
      # framework, which Windows Server lacks; the bundle needs no VCLibs.
      # Version and hash are pinned; the hash is the release asset's own
      # SHA-256. The scenarios start wt.exe by searching PATH, so the
      # folder holding its execution alias goes on PATH for later steps,
      # and the step fails unless the package and the alias are there.
      # Windows PowerShell runs it, since PowerShell 7's Appx module is not
      # reliable; its progress display is off, which otherwise slows the
      # download many times over.
      - name: Install Windows Terminal
        shell: powershell
        env:
          WT_VERSION: 1.24.12741.0
          WT_KIT_SHA256: a913cbe4dddb8ce9939040c015f3fb3dade286e904fea227f1c0982b5fcb7cf3
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $kit = "Microsoft.WindowsTerminal_${env:WT_VERSION}_8wekyb3d8bbwe.msixbundle_Windows10_PreinstallKit.zip"
          $zip = Join-Path $env:RUNNER_TEMP $kit
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/microsoft/terminal/releases/download/v$env:WT_VERSION/$kit" -OutFile $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:WT_KIT_SHA256) {
            Write-Error "$kit has SHA-256 $hash, not the pinned $env:WT_KIT_SHA256"
            exit 1
          }
          $dir = Join-Path $env:RUNNER_TEMP "windows-terminal"
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $bundle = Get-ChildItem -Path $dir -Filter *.msixbundle | Select-Object -First 1
          $xaml = Get-ChildItem -Path $dir -Filter "Microsoft.UI.Xaml.2.8_*_x64__8wekyb3d8bbwe.appx" | Select-Object -First 1
          if (-not $bundle -or -not $xaml) {
            Write-Error "the preinstall kit lacks the bundle or the x64 Microsoft.UI.Xaml.2.8 framework"
            exit 1
          }
          Add-AppxPackage -Path $bundle.FullName -DependencyPath $xaml.FullName
          Get-AppxPackage Microsoft.WindowsTerminal | Format-List Name, Version, Architecture
          $aliases = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps"
          if (-not (Test-Path (Join-Path $aliases "wt.exe"))) {
            Write-Error "Windows Terminal installed, but its wt.exe alias is not in $aliases"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $aliases
      # The runner's Windows Server has classic Notepad, without Windows 11
      # Notepad's spell checker, so the scenarios the registry marks
      # local-only are skipped here, and only here (docs/tooling.md).
      - name: Run the E2E suite against a local agent
        env:
          VERBATIM_E2E_ENDPOINT: 127.0.0.1:44001
          VERBATIM_E2E_SKIP_LOCAL_ONLY: "1"
        shell: pwsh
        run: |
          $agent = Start-Process -FilePath "target\debug\verbatim-agent.exe" `
            -ArgumentList "--bind-address 127.0.0.1 --port 44001" `
            -RedirectStandardOutput "verbatim-agent-stdout.log" `
            -RedirectStandardError "verbatim-agent-stderr.log" `
            -PassThru
          $ready = $false
          for ($attempt = 0; $attempt -lt 40; $attempt++) {
            $probe = Test-NetConnection -ComputerName 127.0.0.1 -Port 44001 -WarningAction SilentlyContinue
            if ($probe.TcpTestSucceeded) {
              $ready = $true
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) {
            Write-Error "verbatim-agent never started listening on 127.0.0.1:44001"
            exit 1
          }
          cargo test -p verbatim-e2e --no-fail-fast -- --test-threads=1 2>&1 | Tee-Object -FilePath verbatim-e2e-test-output.log
          $status = $LASTEXITCODE
          Stop-Process -Id $agent.Id -ErrorAction SilentlyContinue
          exit $status
      # Kept for passing runs as well as failing ones: each scenario's
      # directory holds its video, timeline, logs, and summary.
      - name: Upload E2E output and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verbatim-e2e-output
          path: |
            verbatim-e2e-test-output.log
            verbatim-agent-stdout.log
            verbatim-agent-stderr.log
            target/e2e-artifacts/
            !target/e2e-artifacts/history/
          if-no-files-found: ignore
