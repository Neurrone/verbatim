# CI per docs/architecture.md D3: GitHub-hosted Windows runners build and run
# unit and provider tests, then the end-to-end suite runner-direct (the e2e
# job below).
#
# The nvda/ submodule is reference material only and is deliberately not
# checked out here (actions/checkout does not fetch submodules by default).
# The third_party/espeak-ng submodule is fetched by each job: eSpeak NG is
# built from it as part of the workspace.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by hand (`gh workflow run ci.yml -f scenario=<name> -f repeat=<n>`)
  # to run one end-to-end scenario n times on GitHub's runner, as evidence
  # for an intermittent failure, without a push for each run. Only the e2e
  # job runs, and every run's artifacts are kept (docs/tooling/e2e.md).
  workflow_dispatch:
    inputs:
      scenario:
        description: The end-to-end scenario to run, by its exact name
        required: true
        type: string
      repeat:
        description: How many times to run it, one after another
        required: true
        default: "10"
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch eSpeak NG's source
        run: git submodule update --init --depth 1 third_party/espeak-ng
      # rust-toolchain.toml pins the toolchain, installed on the first cargo
      # invocation; everything builds for the runner's own architecture.
      - uses: Swatinem/rust-cache@v2
      # The GUI's static wxWidgets build (crates/verbatim-gui/build/wx.rs)
      # goes to a fixed directory per version and architecture; caching it
      # spares every run the build. The key follows the recipe file.
      - name: Point the wxWidgets build at a cached directory
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERBATIM_WX_DIR=$env:USERPROFILE\verbatim-wx"
      - uses: actions/cache@v6
        with:
          path: ~/verbatim-wx
          key: wxwidgets-3.3.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/verbatim-gui/build/wx.rs') }}
      # `cargo xtask ci` checks the workspace-hack crate with cargo-hakari.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari
      # Environment preparation: a fresh runner's first activation of the
      # Windows speech platform takes longer than the synthesizer host's
      # ten-second hang bound, and the unit tests start several OneCore
      # hosts at once that would all wait on it. Activating it once here
      # pays that cost before the tests and shows it in the job log.
      - name: Warm the Windows speech platform
        run: cargo xtask warm-speech
      - name: Run CI checks
        run: cargo xtask ci
      # The unit tests launch the synthesizer host as Verbatim does, and
      # its step-by-step start log goes to target/debug/logs/<pid>/
      # (crates/verbatim-process/src/lib.rs, launch_log_dir), never to the
      # job log; a failed job keeps those logs so a host that did not
      # become ready shows the step where it stopped (docs/roadmap.md).
      - name: Upload the child-process logs of the unit tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verbatim-ci-logs-${{ runner.arch }}
          path: target/debug/logs/
          if-no-files-found: ignore

  # The same checks on an ARM64 runner: nothing names a target, so this
  # job builds and tests ARM64, as `ci` does x64.
  ci-arm64:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - name: Fetch eSpeak NG's source
        run: git submodule update --init --depth 1 third_party/espeak-ng
      - name: Install rustup if the image lacks it
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain none --profile minimal
            Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.cargo\bin"
          }
      - uses: Swatinem/rust-cache@v2
      # The GUI's static wxWidgets build (crates/verbatim-gui/build/wx.rs)
      # goes to a fixed directory per version and architecture; caching it
      # spares every run the build. The key follows the recipe file.
      - name: Point the wxWidgets build at a cached directory
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERBATIM_WX_DIR=$env:USERPROFILE\verbatim-wx"
      - uses: actions/cache@v6
        with:
          path: ~/verbatim-wx
          key: wxwidgets-3.3.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/verbatim-gui/build/wx.rs') }}
      # `cargo xtask ci` checks the workspace-hack crate with cargo-hakari.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari
      # Environment preparation: a fresh runner's first activation of the
      # Windows speech platform takes longer than the synthesizer host's
      # ten-second hang bound, and the unit tests start several OneCore
      # hosts at once that would all wait on it. Activating it once here
      # pays that cost before the tests and shows it in the job log.
      - name: Warm the Windows speech platform
        run: cargo xtask warm-speech
      - name: Run CI checks
        run: cargo xtask ci
      # The unit tests launch the synthesizer host as Verbatim does, and
      # its step-by-step start log goes to target/debug/logs/<pid>/
      # (crates/verbatim-process/src/lib.rs, launch_log_dir), never to the
      # job log; a failed job keeps those logs so a host that did not
      # become ready shows the step where it stopped (docs/roadmap.md).
      - name: Upload the child-process logs of the unit tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verbatim-ci-logs-${{ runner.arch }}
          path: target/debug/logs/
          if-no-files-found: ignore

  # Milestone M2's runner-direct E2E suite (docs/roadmap.md): builds the
  # debug binaries the suite drives, starts verbatim-agent.exe bound to
  # loopback, points crates/verbatim-e2e at it, and runs the suite serially
  # (one live Verbatim at a time, per crates/verbatim-e2e's Scenario type).
  # A separate job from `ci` so a live-suite failure is easy to tell apart
  # from a build or lint failure; GitHub's Windows runners execute jobs in
  # an interactive session, which is what lets SendInput-based key
  # injection and real window focus work here.
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch eSpeak NG's source
        run: git submodule update --init --depth 1 third_party/espeak-ng
      - uses: Swatinem/rust-cache@v2
      # The GUI's static wxWidgets build (crates/verbatim-gui/build/wx.rs)
      # goes to a fixed directory per version and architecture; caching it
      # spares every run the build. The key follows the recipe file.
      - name: Point the wxWidgets build at a cached directory
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERBATIM_WX_DIR=$env:USERPROFILE\verbatim-wx"
      - uses: actions/cache@v6
        with:
          path: ~/verbatim-wx
          key: wxwidgets-3.3.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/verbatim-gui/build/wx.rs') }}
      # mockapp is the scripted application the spelling errors scenario
      # reads, since the runner's classic Notepad has no spell checker.
      - name: Build Verbatim, its child processes, the agent, and mockapp (debug)
        run: cargo build -p verbatim-app -p verbatim-agent -p verbatim-outpost -p verbatim-synth-host -p mockapp
      # Every scenario is recorded, video and Verbatim's own audio, when
      # ffmpeg can be started (crates/verbatim-e2e/src/recording.rs).
      - name: Make sure ffmpeg is installed
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          ffmpeg -version | Select-Object -First 1
      # The Windows Terminal scenarios drive the harness's own portable copy
      # of Windows Terminal, at the release pinned in
      # crates/verbatim-e2e/src/windows_terminal.rs, never the runner's
      # installed one (docs/tooling/e2e.md). This step downloads it, checks its
      # pinned SHA-256, and unpacks it into target/e2e-stage, exactly as
      # the suite's first launch would, so the runner tests the same
      # version as a developer's machine and a failed download is reported
      # before the suite starts.
      - name: Download the pinned Windows Terminal
        run: cargo xtask windows-terminal
      # Environment preparation, not a workaround in the harness: runner
      # image 20261007.264.1 shows its own "System Properties" message box
      # (SystemPropertiesPerformance.exe, "Windows created a temporary
      # paging file...") at logon. It stays for the whole run, Show Desktop
      # cannot minimize it, and it takes the foreground whenever the window
      # in front closes, so it is closed before the suite. The suite's
      # starting-state check fails, naming it, if such a window is left
      # (docs/tooling/e2e.md).
      - name: Close the runner image's paging-file message box
        shell: pwsh
        run: Get-Process SystemPropertiesPerformance -ErrorAction SilentlyContinue | Stop-Process
      # Every live test is #[ignore]d, so a plain `cargo test` lists it as
      # ignored rather than reporting a pass it never ran; this step runs
      # them with --ignored, and a missing agent fails them. The runner's
      # Windows Server has classic Notepad, not Windows 11 Notepad, and its
      # Settings raises no selection for a first search suggestion as the
      # list opens, so the local-only scenarios, named notepad_ and
      # settings_search_suggestions, are deselected by name
      # (libtest counts them as filtered out, never as passed), and
      # VERBATIM_E2E_SKIP_LOCAL_ONLY makes one that ran anyway fail. The
      # demonstrations, named demo_, are recorded by `cargo xtask demo`
      # and are not part of the suite (docs/tooling/e2e.md).
      # The agent is started in the same step as the suite: GitHub's Windows
      # runner ends the processes a step started when that step finishes, so
      # an agent started in a step of its own was gone (connection refused)
      # by the time the suite ran. NVDA's system tests start NVDA inside
      # their test step for the same reason.
      - name: Run the E2E suite against a local agent
        env:
          VERBATIM_E2E_ENDPOINT: 127.0.0.1:44001
          VERBATIM_E2E_SKIP_LOCAL_ONLY: "1"
          E2E_SCENARIO: ${{ inputs.scenario }}
          E2E_REPEAT: ${{ inputs.repeat }}
        shell: pwsh
        run: |
          $agent = Start-Process -FilePath "target\debug\verbatim-agent.exe" `
            -ArgumentList "--bind-address 127.0.0.1 --port 44001" `
            -RedirectStandardOutput "verbatim-agent-stdout.log" `
            -RedirectStandardError "verbatim-agent-stderr.log" `
            -PassThru
          $ready = $false
          for ($attempt = 0; $attempt -lt 40; $attempt++) {
            $probe = Test-NetConnection -ComputerName 127.0.0.1 -Port 44001 -WarningAction SilentlyContinue
            if ($probe.TcpTestSucceeded) {
              $ready = $true
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) {
            Write-Error "verbatim-agent never started listening on 127.0.0.1:44001"
            exit 1
          }
          if ($env:E2E_SCENARIO) {
            # Started by hand: one scenario, run E2E_REPEAT times, each in
            # its own test process as a suite run would run it; a failed
            # run fails the step but the remaining runs still go ahead.
            # A repeat below 1, or a name that lists no test (a misspelling
            # runs nothing and passes), fails before any run.
            $repeat = 0
            if (-not [int]::TryParse($env:E2E_REPEAT, [ref]$repeat) -or $repeat -lt 1) {
              Write-Error "repeat must be a whole number of at least 1, not '$env:E2E_REPEAT'"
              exit 1
            }
            $listed = @(cargo test -p verbatim-e2e --test e2e -- --ignored --list --exact $env:E2E_SCENARIO | Where-Object { $_ -match ': test$' })
            if ($LASTEXITCODE -ne 0 -or $listed.Count -ne 1) {
              Write-Error "the scenario '$env:E2E_SCENARIO' must name exactly one test; it lists $($listed.Count): $($listed -join ', ')"
              exit 1
            }
            $status = 0
            for ($run = 1; $run -le $repeat; $run++) {
              "run $run of $env:E2E_REPEAT" | Tee-Object -FilePath verbatim-e2e-test-output.log -Append
              cargo test -p verbatim-e2e --test e2e -- --ignored --exact $env:E2E_SCENARIO --test-threads=1 2>&1 | Tee-Object -FilePath verbatim-e2e-test-output.log -Append
              if ($LASTEXITCODE -ne 0) { $status = $LASTEXITCODE }
            }
          } else {
            cargo test -p verbatim-e2e --no-fail-fast -- --ignored --skip demo_ --skip measure_ --skip notepad_ --skip settings_search_suggestions --test-threads=1 2>&1 | Tee-Object -FilePath verbatim-e2e-test-output.log
            $status = $LASTEXITCODE
          }
          Stop-Process -Id $agent.Id -ErrorAction SilentlyContinue
          exit $status
      # Kept for passing runs as well as failing ones: each scenario's
      # directory holds its video, timeline, logs, and summary.
      - name: Upload E2E output and videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verbatim-e2e-output
          path: |
            verbatim-e2e-test-output.log
            verbatim-agent-stdout.log
            verbatim-agent-stderr.log
            target/e2e-artifacts/
            !target/e2e-artifacts/history/
          if-no-files-found: ignore
      # A run started by hand repeats one scenario, and only the latest run
      # is in the scenario's own directory, so each run's copy in the
      # history (which leaves out the video) is kept as well.
      - name: Upload every run's artifacts of a repeated scenario
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: verbatim-e2e-history
          path: target/e2e-artifacts/history/
          if-no-files-found: ignore
