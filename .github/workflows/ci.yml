# CI per docs/architecture.md D3: GitHub-hosted Windows runners build and run
# unit and provider tests, then the end-to-end suite runner-direct (the e2e
# job below); a Linux runner lints and tests the platform-neutral tier and
# xtask (the ci-linux job).
#
# The nvda/ submodule is reference material only and is deliberately not
# checked out here (actions/checkout does not fetch submodules by default).
# The third_party/espeak-ng submodule is fetched by each job that builds
# the Windows workspace (ci, ci-arm64, e2e): eSpeak NG is built from it.
# ci-linux, docs and changes build no crate that needs it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by hand, one of two runs:
  # - `gh workflow run ci.yml -f scenario=<name> -f repeat=<n>` runs one
  #   end-to-end scenario n times on GitHub's runner, as evidence for an
  #   intermittent failure, without a push for each run. Only the e2e job
  #   runs, and every run's artifacts are kept (docs/tooling/e2e.md).
  # - `gh workflow run ci.yml -f coverage=true` measures line coverage per
  #   test level (docs/tooling/coverage.md): the ci job runs
  #   `cargo xtask coverage` instead of `cargo xtask ci`, the e2e groups run
  #   the suite against an instrumented build, and the coverage job merges
  #   the levels.
  workflow_dispatch:
    inputs:
      scenario:
        description: The end-to-end scenario to run, by its exact name (none for a coverage run)
        required: false
        type: string
      repeat:
        description: How many times to run it, one after another
        required: false
        default: "10"
        type: string
      coverage:
        description: Measure line coverage of every test level instead
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether anything other than documentation changed: a push or pull
  # request that changes only Markdown files and docs/ runs the docs job
  # alone, since building and testing would test nothing new. A run started
  # by hand, or a push whose base is unknown, counts as a code change.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            push) base="$BEFORE" ;;
            pull_request) base="$BASE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" "$GITHUB_SHA" | grep -qvE '(\.md$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The documentation check alone, for a change that touches nothing else;
  # `cargo xtask ci` runs the same check when code changed. On Linux, xtask
  # builds only its portable part, not the Windows bindings and the
  # end-to-end crates, so a documentation change gets its answer sooner.
  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Check the documents' links and paths
        run: cargo xtask docs

  # In a coverage run, this job measures the unit and mockapp tests'
  # coverage rather than running the checks.
  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'workflow_dispatch' || inputs.coverage)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch eSpeak NG's source
        run: git submodule update --init --depth 1 third_party/espeak-ng
      # rust-toolchain.toml pins the toolchain, installed on the first cargo
      # invocation; everything builds for the runner's own architecture.
      - uses: Swatinem/rust-cache@v2
      # The GUI's static wxWidgets build (crates/verbatim-gui/build/wx.rs)
      # goes to a fixed directory per version and architecture; caching it
      # spares every run the build. The key follows the recipe file.
      - name: Point the wxWidgets build at a cached directory
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERBATIM_WX_DIR=$env:USERPROFILE\verbatim-wx"
      - uses: actions/cache@v6
        with:
          path: ~/verbatim-wx
          key: wxwidgets-3.3.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/verbatim-gui/build/wx.rs') }}
      # `cargo xtask ci` checks the workspace-hack crate with cargo-hakari
      # and runs the unit tests with cargo-nextest.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari,cargo-nextest@0.9.151
      # `cargo xtask coverage` runs this release alone (LLVM_COV_VERSION
      # in xtask/src/coverage.rs).
      - uses: taiki-e/install-action@v2
        if: inputs.coverage
        with:
          tool: cargo-llvm-cov@0.9.1
      # Environment preparation: a fresh runner's first activation of the
      # Windows speech platform takes longer than the synthesizer host's
      # ten-second hang bound, and the unit tests start several OneCore
      # hosts at once that would all wait on it. Activating it once here
      # pays that cost before the tests and shows it in the job log.
      - name: Warm the Windows speech platform
        run: cargo xtask warm-speech
      - name: Run CI checks
        if: ${{ !inputs.coverage }}
        run: cargo xtask ci
      - name: Measure the unit and mockapp tests' coverage
        if: inputs.coverage
        run: cargo xtask coverage
      - name: Upload the unit and mockapp coverage reports
        if: inputs.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: target/coverage/
      # The unit tests launch the synthesizer host as Verbatim does, and
      # its step-by-step start log goes to target/debug/logs/<pid>/
      # (crates/verbatim-process/src/lib.rs, launch_log_dir), never to the
      # job log; a failed job keeps those logs so a host that did not
      # become ready shows the step where it stopped (docs/roadmap.md).
      - name: Upload the child-process logs of the unit tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verbatim-ci-logs-${{ runner.arch }}
          path: target/debug/logs/
          if-no-files-found: ignore

  # The same checks on an ARM64 runner: nothing names a target, so this
  # job builds and tests ARM64, as `ci` does x64.
  ci-arm64:
    needs: changes
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true'
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - name: Fetch eSpeak NG's source
        run: git submodule update --init --depth 1 third_party/espeak-ng
      - name: Install rustup if the image lacks it
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain none --profile minimal
            Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.cargo\bin"
          }
      - uses: Swatinem/rust-cache@v2
      # The GUI's static wxWidgets build (crates/verbatim-gui/build/wx.rs)
      # goes to a fixed directory per version and architecture; caching it
      # spares every run the build. The key follows the recipe file.
      - name: Point the wxWidgets build at a cached directory
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERBATIM_WX_DIR=$env:USERPROFILE\verbatim-wx"
      - uses: actions/cache@v6
        with:
          path: ~/verbatim-wx
          key: wxwidgets-3.3.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/verbatim-gui/build/wx.rs') }}
      # `cargo xtask ci` checks the workspace-hack crate with cargo-hakari
      # and runs the unit tests with cargo-nextest.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari,cargo-nextest@0.9.151
      # Environment preparation: a fresh runner's first activation of the
      # Windows speech platform takes longer than the synthesizer host's
      # ten-second hang bound, and the unit tests start several OneCore
      # hosts at once that would all wait on it. Activating it once here
      # pays that cost before the tests and shows it in the job log.
      - name: Warm the Windows speech platform
        run: cargo xtask warm-speech
      - name: Run CI checks
        run: cargo xtask ci
      # The unit tests launch the synthesizer host as Verbatim does, and
      # its step-by-step start log goes to target/debug/logs/<pid>/
      # (crates/verbatim-process/src/lib.rs, launch_log_dir), never to the
      # job log; a failed job keeps those logs so a host that did not
      # become ready shows the step where it stopped (docs/roadmap.md).
      - name: Upload the child-process logs of the unit tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verbatim-ci-logs-${{ runner.arch }}
          path: target/debug/logs/
          if-no-files-found: ignore

  # `cargo xtask ci` on Linux: the dependency check, the scans and the
  # documentation check, then clippy and unit tests for the crates in
  # LINUX_CRATES (xtask/src/main.rs), the platform-neutral tier and xtask.
  # Nothing names a target, so it builds for the runner's own architecture.
  # No submodule, wxWidgets, cargo-hakari or speech warm-up: none of them is
  # in what it builds or runs.
  ci-linux:
    needs: changes
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the toolchain, installed on the first cargo
      # invocation.
      - uses: Swatinem/rust-cache@v2
      - name: Run CI checks
        run: cargo xtask ci

  # Milestone M2's runner-direct E2E suite (docs/roadmap.md): builds the
  # debug binaries the suite drives, starts verbatim-agent.exe bound to
  # loopback, points crates/verbatim-e2e at it, and runs the scenarios
  # serially (one live Verbatim at a time, per crates/verbatim-e2e's
  # Scenario type). A separate job from `ci` so a live-suite failure is
  # easy to tell apart from a build or lint failure; GitHub's Windows
  # runners execute jobs in an interactive session, which is what lets
  # SendInput-based key injection and real window focus work here.
  # The suite is split into groups, one runner each, running in parallel
  # as NVDA's system tests do. The plan job chooses how many, every run;
  # each group's `cargo xtask e2e-group` names its scenarios, the share
  # for that count (docs/tooling/e2e.md, "How CI runs the suite"). A run
  # started by hand repeats one scenario, so it is one job.
  # How many groups the e2e job runs the suite in, as its matrix
  # (`{"group":[1,2,...]}`): the fewest whose estimates from
  # xtask/e2e-durations.txt are each within 9 minutes, since each group's
  # suite step times out at 10. `cargo xtask e2e-plan` reads the suite from
  # the registry's and the test file's source, so this job builds only
  # xtask's portable part, on Linux. A coverage run's groups run an
  # instrumented build, so `--coverage` multiplies every estimate by its
  # measured slowdown and the run gets more groups. A run started by hand
  # to repeat a scenario is one group, and one that names neither a
  # scenario nor coverage fails here.
  plan:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch' || inputs.coverage
      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'workflow_dispatch' || inputs.coverage
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          COVERAGE: ${{ inputs.coverage }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          if [ "$COVERAGE" = true ]; then
            groups=$(cargo xtask e2e-plan --coverage)
          elif [ "$EVENT" = workflow_dispatch ]; then
            if [ -z "$SCENARIO" ]; then
              echo "::error::a run started by hand names a scenario, or sets coverage"
              exit 1
            fi
            groups='{"group":[1]}'
          else
            groups=$(cargo xtask e2e-plan)
          fi
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  e2e:
    needs: [changes, plan]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch eSpeak NG's source
        run: git submodule update --init --depth 1 third_party/espeak-ng
      # A coverage run instruments every build of this job, with the
      # environment `cargo llvm-cov show-env` prints, and each process
      # writes a profile of its own (%p, %m) to target/coverage-profiles
      # (docs/tooling/coverage.md). It is set before the build cache, whose
      # key then follows it.
      - uses: taiki-e/install-action@v2
        if: inputs.coverage
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Instrument the build for coverage
        if: inputs.coverage
        shell: pwsh
        run: |
          cargo --version
          rustup component add llvm-tools-preview
          # Each line is NAME=value, a value with special characters in
          # single quotes, shell style.
          $lines = @(cargo llvm-cov show-env)
          if ($LASTEXITCODE -ne 0 -or $lines.Count -eq 0) { throw "cargo llvm-cov show-env failed" }
          foreach ($line in $lines) {
            if ($line -notmatch '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$') { throw "cargo llvm-cov show-env printed '$line'" }
            $value = $Matches[2]
            if ($value.StartsWith("'")) { $value = $value.Substring(1, $value.Length - 2).Replace("'\''", "'") }
            Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$value"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "LLVM_PROFILE_FILE=$env:GITHUB_WORKSPACE\target\coverage-profiles\%p-%m.profraw"
      - uses: Swatinem/rust-cache@v2
      # The GUI's static wxWidgets build (crates/verbatim-gui/build/wx.rs)
      # goes to a fixed directory per version and architecture; caching it
      # spares every run the build. The key follows the recipe file.
      - name: Point the wxWidgets build at a cached directory
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERBATIM_WX_DIR=$env:USERPROFILE\verbatim-wx"
      - uses: actions/cache@v6
        with:
          path: ~/verbatim-wx
          key: wxwidgets-3.3.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/verbatim-gui/build/wx.rs') }}
      # mockapp is the scripted application the spelling errors scenario
      # reads, since the runner's classic Notepad has no spell checker.
      - name: Build Verbatim, its child processes, the agent, and mockapp (debug)
        run: cargo build -p verbatim-app -p verbatim-agent -p verbatim-outpost -p verbatim-listener -p verbatim-synth-host -p mockapp
      # Every scenario is recorded, video and Verbatim's own audio, when
      # ffmpeg can be started (crates/verbatim-e2e/src/recording.rs).
      # The test binary and xtask are compiled here, before the timed step,
      # so the group's 10 minutes hold only the agent's start and the
      # scenarios the table measures.
      - name: Build the end-to-end test binary and xtask
        run: |
          cargo test -p verbatim-e2e --test e2e --no-run
          cargo build -p xtask
      - name: Make sure ffmpeg is installed
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          ffmpeg -version | Select-Object -First 1
      # The Windows Terminal scenarios drive the harness's own portable copy
      # of Windows Terminal, at the release pinned in
      # crates/verbatim-e2e/src/windows_terminal.rs, never the runner's
      # installed one (docs/tooling/e2e.md). This step downloads it, checks its
      # pinned SHA-256, and unpacks it into target/e2e-stage, exactly as
      # the suite's first launch would, so the runner tests the same
      # version as a developer's machine and a failed download is reported
      # before the suite starts.
      - name: Download the pinned Windows Terminal
        run: cargo xtask windows-terminal
      # Environment preparation, not a workaround in the harness: runner
      # image 20261007.264.1 shows its own "System Properties" message box
      # (SystemPropertiesPerformance.exe, "Windows created a temporary
      # paging file...") at logon. It stays for the whole run, Show Desktop
      # cannot minimize it, and it takes the foreground whenever the window
      # in front closes, so it is closed before the suite. The suite's
      # starting-state check fails, naming it, if such a window is left
      # (docs/tooling/e2e.md).
      - name: Close the runner image's paging-file message box
        shell: pwsh
        run: Get-Process SystemPropertiesPerformance -ErrorAction SilentlyContinue | Stop-Process
      # Every live test is #[ignore]d, so a plain `cargo test` lists it as
      # ignored rather than reporting a pass it never ran; this step runs
      # its group's scenarios with --ignored, each named with --exact, and
      # a missing agent fails them. The group's list leaves out the
      # demonstrations, the measure set, and the local-only scenarios
      # (the registry's local_only flag), which need a Windows 11 desktop
      # the runner's Windows Server is not; VERBATIM_E2E_SKIP_LOCAL_ONLY
      # makes one that ran anyway fail (docs/tooling/e2e.md).
      # The agent is started in the same step as the suite: GitHub's Windows
      # runner ends the processes a step started when that step finishes, so
      # an agent started in a step of its own was gone (connection refused)
      # by the time the suite ran. NVDA's system tests start NVDA inside
      # their test step for the same reason.
      # A group's scenarios must finish within 10 minutes, which the plan
      # job's sizing meets by the table, a coverage run's included; a run
      # started by hand to repeat one scenario repeats it as often as
      # asked, so it has the job's limit instead.
      - name: Run the E2E suite against a local agent
        timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && !inputs.coverage && 360 || 10 }}
        env:
          VERBATIM_E2E_ENDPOINT: 127.0.0.1:44001
          VERBATIM_E2E_SKIP_LOCAL_ONLY: "1"
          E2E_SCENARIO: ${{ inputs.scenario }}
          E2E_REPEAT: ${{ inputs.repeat }}
          E2E_GROUP: ${{ matrix.group }}
          E2E_GROUPS: ${{ strategy.job-total }}
        shell: pwsh
        run: |
          # The build cache restores target\, scenario folders and coverage
          # profiles included, so they are cleared first: the uploads below
          # then hold only what this group's scenarios wrote.
          Remove-Item -Recurse -Force target\e2e-artifacts -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force target\coverage-profiles -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force target\coverage -ErrorAction SilentlyContinue
          $agent = Start-Process -FilePath "target\debug\verbatim-agent.exe" `
            -ArgumentList "--bind-address 127.0.0.1 --port 44001" `
            -RedirectStandardOutput "verbatim-agent-stdout.log" `
            -RedirectStandardError "verbatim-agent-stderr.log" `
            -PassThru
          $ready = $false
          for ($attempt = 0; $attempt -lt 40; $attempt++) {
            $probe = Test-NetConnection -ComputerName 127.0.0.1 -Port 44001 -WarningAction SilentlyContinue
            if ($probe.TcpTestSucceeded) {
              $ready = $true
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) {
            Write-Error "verbatim-agent never started listening on 127.0.0.1:44001"
            exit 1
          }
          if ($env:E2E_SCENARIO) {
            # Started by hand: one scenario, run E2E_REPEAT times, each in
            # its own test process as a suite run would run it; a failed
            # run fails the step but the remaining runs still go ahead.
            # A repeat below 1, or a name that lists no test (a misspelling
            # runs nothing and passes), fails before any run.
            $repeat = 0
            if (-not [int]::TryParse($env:E2E_REPEAT, [ref]$repeat) -or $repeat -lt 1) {
              Write-Error "repeat must be a whole number of at least 1, not '$env:E2E_REPEAT'"
              exit 1
            }
            $listed = @(cargo test -p verbatim-e2e --test e2e -- --ignored --list --exact $env:E2E_SCENARIO | Where-Object { $_ -match ': test$' })
            if ($LASTEXITCODE -ne 0 -or $listed.Count -ne 1) {
              Write-Error "the scenario '$env:E2E_SCENARIO' must name exactly one test; it lists $($listed.Count): $($listed -join ', ')"
              exit 1
            }
            $status = 0
            for ($run = 1; $run -le $repeat; $run++) {
              "run $run of $env:E2E_REPEAT" | Tee-Object -FilePath verbatim-e2e-test-output.log -Append
              cargo test -p verbatim-e2e --test e2e -- --ignored --exact $env:E2E_SCENARIO --test-threads=1 2>&1 | Tee-Object -FilePath verbatim-e2e-test-output.log -Append
              if ($LASTEXITCODE -ne 0) { $status = $LASTEXITCODE }
            }
          } else {
            # The group's scenarios, one name a line. No filter would run
            # every test, so an empty list fails the step.
            $names = @(cargo xtask e2e-group "$env:E2E_GROUP/$env:E2E_GROUPS")
            if ($LASTEXITCODE -ne 0 -or $names.Count -eq 0) {
              Write-Error "cargo xtask e2e-group $env:E2E_GROUP/$env:E2E_GROUPS named no scenarios"
              exit 1
            }
            cargo test -p verbatim-e2e --test e2e -- --ignored --exact @names --test-threads=1 2>&1 | Tee-Object -FilePath verbatim-e2e-test-output.log
            $status = $LASTEXITCODE
          }
          Stop-Process -Id $agent.Id -ErrorAction SilentlyContinue
          exit $status
      # The group's coverage, passing or failing: the lcov file and HTML
      # report of its profiles, which the coverage job merges, and the
      # profiles themselves, in an artifact of their own so that job does
      # not download them.
      - name: Report the group's coverage
        if: always() && inputs.coverage
        run: cargo xtask coverage report e2e-${{ matrix.group }} target/coverage-profiles
      - name: Upload the group's coverage
        if: always() && inputs.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-e2e-${{ matrix.group }}
          path: target/coverage/
          if-no-files-found: ignore
      - name: Upload the group's coverage profiles
        if: always() && inputs.coverage
        uses: actions/upload-artifact@v7
        with:
          name: profiles-e2e-${{ matrix.group }}
          path: target/coverage-profiles/
          if-no-files-found: ignore
      # The build cache's save, after the last step, would keep them.
      - name: Delete the group's coverage
        if: always() && inputs.coverage
        shell: pwsh
        run: Remove-Item -Recurse -Force target\coverage, target\coverage-profiles -ErrorAction SilentlyContinue
      # The group's own logs, small: the test output and the agent's.
      - name: Upload the group's test output and agent logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-group-${{ matrix.group }}
          path: |
            verbatim-e2e-test-output.log
            verbatim-agent-stdout.log
            verbatim-agent-stderr.log
          if-no-files-found: ignore
      # One artifact per scenario that ran, passing or failing, named
      # e2e-<scenario> and holding its whole directory: video, timeline,
      # logs, and summary.txt, whose "result:" line says whether it
      # passed. upload-artifact makes one artifact per step, so the loop
      # calls its library, @actions/artifact (the version
      # upload-artifact@v7 uses), from github-script. A group of about 15
      # scenarios stays far below GitHub's 500 artifacts a job. The videos
      # are already compressed, so the archives are not (compression
      # level 0).
      - name: Install the artifact upload library
        if: always()
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP\artifact-client" --no-save --ignore-scripts --no-audit --no-fund @actions/artifact@6.3.1
      - name: Upload each scenario's directory
        if: always()
        uses: actions/github-script@v9
        env:
          ARTIFACT_CLIENT: ${{ runner.temp }}\artifact-client
        with:
          script: |
            const fs = await import('node:fs');
            const path = await import('node:path');
            const { pathToFileURL } = await import('node:url');
            const library = path.join(process.env.ARTIFACT_CLIENT, 'node_modules', '@actions', 'artifact', 'lib', 'artifact.js');
            const { default: client } = await import(pathToFileURL(library).href);
            const root = path.join(process.env.GITHUB_WORKSPACE, 'target', 'e2e-artifacts');
            if (!fs.existsSync(root)) {
              return;
            }
            const failed = [];
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              if (!entry.isDirectory() || entry.name === 'history') {
                continue;
              }
              const folder = path.join(root, entry.name);
              const files = fs.readdirSync(folder, { recursive: true, withFileTypes: true })
                .filter((file) => file.isFile())
                .map((file) => path.join(file.parentPath, file.name));
              try {
                const { size } = await client.uploadArtifact(`e2e-${entry.name}`, files, root, { compressionLevel: 0 });
                core.info(`e2e-${entry.name}: ${files.length} files, ${size} bytes`);
              } catch (error) {
                failed.push(entry.name);
                core.error(`e2e-${entry.name}: ${error.message}`);
              }
            }
            if (failed.length > 0) {
              core.setFailed(`no artifact for: ${failed.join(', ')}`);
            }
      # A run started by hand repeats one scenario, and only the latest run
      # is in the scenario's own directory, so each run's copy in the
      # history (which leaves out the video) is kept as well.
      - name: Upload every run's artifacts of a repeated scenario
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: verbatim-e2e-history
          path: target/e2e-artifacts/history/
          if-no-files-found: ignore

  # A coverage run's last job: merges the unit and mockapp levels' lcov
  # files and every e2e group's with `cargo xtask coverage merge`, writes
  # HTML reports of the e2e level and the merged one with genhtml, and
  # uploads them with the unit and mockapp reports as `coverage-report`
  # (docs/tooling/coverage.md). It runs when a group failed too, since a
  # failing scenario's profile still counts.
  coverage:
    needs: [ci, e2e]
    if: always() && inputs.coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: downloaded
      - name: Merge the levels
        shell: bash
        run: |
          mkdir -p report
          find downloaded -name '*.lcov' -exec cp -t report {} +
          cp -r downloaded/coverage-unit/unit downloaded/coverage-unit/mockapp report/
          cargo xtask coverage merge report
          cat report/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Write the e2e and merged levels' HTML reports
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends lcov
          for level in e2e merged; do
            genhtml --output-directory "report/$level/html" "report/$level.lcov"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: report/
