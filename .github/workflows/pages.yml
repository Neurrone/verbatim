# The documentation site: every book under books/ built with mdBook, beside
# the homepage books/index.html. Every push and pull request that touches
# books/, or CONTRIBUTING.md, which the Development guide includes, builds
# it, so a broken book fails before it reaches main; only a push to main
# publishes it to GitHub Pages. Includes are invisible to cargo xtask docs,
# so a new include outside books/ joins the paths below.

name: Pages

on:
  push:
    branches: [main]
    paths: ["books/**", "CONTRIBUTING.md", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["books/**", "CONTRIBUTING.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; a newer push replaces a waiting one, but a
# publish already running finishes.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: Build the books
        run: |
          mkdir -p site
          cp books/index.html site/index.html
          for config in books/*/book.toml; do
            book=$(basename "$(dirname "$config")")
            mdbook build "books/$book" --dest-dir "$PWD/site/$book"
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
