[package]
name = "verbatim-supervisor"
description = "Core's side of starting, watching and ending its children: the outposts and the focus listener"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
crossbeam-channel.workspace = true
tracing.workspace = true
verbatim-core.workspace = true
verbatim-faults = { workspace = true, optional = true }
verbatim-model.workspace = true
verbatim-process.workspace = true
verbatim-win32.workspace = true
windows.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
verbatim-faults.workspace = true

[features]
# `Sealed::for_tests`, so the app's tests can hand its reducer the
# supervisor's lifecycle notices.
lifecycle-for-tests = []
# The fault points of the relay's mailbox and of the port queue the app's
# sink posts to, for the `fault_paths` tests; only `cargo xtask faults`
# turns it on.
faults = ["dep:verbatim-faults", "verbatim-process/faults"]

[lints]
workspace = true

# Runs itself as stand-in applications, listener, and outpost, which its
# own `main` recognizes.
[[test]]
name = "ignored_process"
harness = false

# Runs itself as a stand-in child, which its own `main` recognizes.
[[test]]
name = "shutdown_fallback"
harness = false

# Runs itself as a stand-in application, outpost, and listener, which its own
# `main` recognizes.
[[test]]
name = "target_gone"
harness = false

# Runs itself as a stand-in application, outpost, and listener, which its own
# `main` recognizes.
[[test]]
name = "idle_round"
harness = false

# Runs itself as a stand-in application, outpost, and listener, which its own
# `main` recognizes.
[[test]]
name = "arrival_order"
harness = false

# Runs itself as stand-in applications, listener, outposts, and spares,
# which its own `main` recognizes.
[[test]]
name = "spares"
harness = false

# Runs itself as stand-in applications, listener, and outposts, which its
# own `main` recognizes; arms fault points, so only `cargo xtask faults`
# builds it.
[[test]]
name = "fault_paths"
harness = false
required-features = ["faults"]
