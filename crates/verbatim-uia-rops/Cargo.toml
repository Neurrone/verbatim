[package]
name = "verbatim-uia-rops"
description = "UIA Remote Operations wrapper: batched in-provider execution for ancestor fetches, text runs, and buffer builds"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tracing.workspace = true
verbatim-faults = { workspace = true, optional = true }
verbatim-model.workspace = true
verbatim-uia.workspace = true
verbatim-win32.workspace = true
windows.workspace = true
windows-collections.workspace = true
windows-core.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
verbatim-faults.workspace = true

[features]
# The generated programs' fault points, for mockapp's `batch_faults` test;
# only `cargo xtask faults` turns it on.
faults = ["dep:verbatim-faults"]
