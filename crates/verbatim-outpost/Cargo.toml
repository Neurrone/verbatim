[package]
name = "verbatim-outpost"
description = "Per-application outpost process plus the Core-side supervisor"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
verbatim-ia2.workspace = true
verbatim-model.workspace = true
verbatim-process.workspace = true
verbatim-text.workspace = true
verbatim-uia.workspace = true
verbatim-uia-rops.workspace = true
windows.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true

# Runs itself as a stand-in child, which its own `main` recognizes.
[[test]]
name = "shutdown_fallback"
harness = false

# Runs itself as a stand-in application, which its own `main` recognizes.
[[test]]
name = "target_exit"
harness = false

# Runs itself as a stand-in application, outpost, and listener, which its own
# `main` recognizes.
[[test]]
name = "target_gone"
harness = false
