[package]
name = "verbatim-outpost"
description = "Per-application outpost process plus the Core-side supervisor"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
crossbeam-channel.workspace = true
serde_json.workspace = true
tracing.workspace = true
verbatim-core.workspace = true
verbatim-faults = { workspace = true, optional = true }
verbatim-ia2.workspace = true
verbatim-model.workspace = true
verbatim-outpost-logic.workspace = true
verbatim-process.workspace = true
verbatim-reader-rules.workspace = true
verbatim-text.workspace = true
verbatim-uia.workspace = true
verbatim-uia-rops.workspace = true
verbatim-win32.workspace = true
windows.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
libtest-mimic.workspace = true
verbatim-faults.workspace = true
verbatim-term-sim.workspace = true
verbatim-test-console.workspace = true

[features]
# The worker's fault point and the observation points of shutdown and of a
# caret watch's end, for mockapp's `failure_paths`, `shutdown` and
# `terminal_reading` tests; only `cargo xtask faults` turns it on.
faults = ["dep:verbatim-faults"]

[lints]
workspace = true

# Runs itself as a stand-in application, which its own `main` recognizes.
[[test]]
name = "target_exit"
harness = false
