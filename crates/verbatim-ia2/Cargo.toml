[package]
name = "verbatim-ia2"
description = "MSAA/IA2 client stack: out-of-context WinEvents and IAccessible2 acquisition"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
crossbeam-channel.workspace = true
tracing.workspace = true
verbatim-faults = { workspace = true, optional = true }
verbatim-model.workspace = true
verbatim-process.workspace = true
verbatim-reader-rules.workspace = true
verbatim-text.workspace = true
verbatim-win32.workspace = true
windows.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
verbatim-faults.workspace = true

[features]
# The observation point of the window messages sent, for mockapp's
# `window_messages` tests; only `cargo xtask faults` turns it on.
faults = ["dep:verbatim-faults"]

[lints]
workspace = true
