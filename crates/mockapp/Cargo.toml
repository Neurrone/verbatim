[package]
name = "mockapp"
description = "Scripted UIA and MSAA/IA2 provider host for cross-process client-stack tests"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# Normal and optional only so that the `faults` feature can turn their
# fault points on: a feature cannot name a dev-dependency.
verbatim-faults = { workspace = true, optional = true }
verbatim-model.workspace = true
verbatim-outpost = { workspace = true, optional = true }
verbatim-process.workspace = true
verbatim-uia = { workspace = true, optional = true }
windows.workspace = true
windows-core.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
verbatim-core.workspace = true
verbatim-ia2.workspace = true
verbatim-listener.workspace = true
verbatim-listener-logic.workspace = true
verbatim-outpost.workspace = true
verbatim-uia.workspace = true
verbatim-uia-rops.workspace = true
verbatim-win32.workspace = true

[features]
# The fault points of the outpost's worker, shutdown and UIA subscription,
# for the `failure_paths` and `shutdown` tests; only `cargo xtask faults`
# turns it on.
faults = ["dep:verbatim-faults", "verbatim-outpost/faults", "verbatim-uia/faults"]

# The test binaries that use UIA as a client run through their own runner,
# which ends the process without running DLL detach code; the reason is in
# tests/common/harness.rs.
[[test]]
name = "arbitration"
harness = false

[[test]]
name = "call_counts"
harness = false

[[test]]
name = "caret_watch"
harness = false

[[test]]
name = "combo_box"
harness = false

[[test]]
name = "terminal_reading"
harness = false

# This one runs itself as a subprocess, which its own `main` recognizes.
[[test]]
name = "child_cleanup"
harness = false

[[test]]
name = "controller_for"
harness = false

[[test]]
name = "events"
harness = false

[[test]]
name = "focus_reports"
harness = false

[[test]]
name = "idle_barrier"
harness = false

[[test]]
name = "instruction_limit"
harness = false

[[test]]
name = "msaa_events"
harness = false

[[test]]
name = "msaa_tree"
harness = false

[[test]]
name = "native_controls"
harness = false

[[test]]
name = "remote_ops"
harness = false

# Waits on the outpost's shutdown observation point, so only `cargo xtask
# faults` builds it.
[[test]]
name = "shutdown"
harness = false
required-features = ["faults"]

[[test]]
name = "slow_application"
harness = false

[[test]]
name = "terminal"
harness = false

[[test]]
name = "terminal_snapshot"
harness = false

[[test]]
name = "text"
harness = false

[[test]]
name = "time_limits"
harness = false

[[test]]
name = "uia_bugs"
path = "tests/uia_bugs/main.rs"
harness = false

[[test]]
name = "uia_tree"
harness = false

[[test]]
name = "window_names"
harness = false

[lints]
workspace = true

[[test]]
name = "object_equality"
harness = false

# Arms fault points, so only `cargo xtask faults` builds it.
[[test]]
name = "failure_paths"
harness = false
required-features = ["faults"]
