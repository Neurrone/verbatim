[package]
name = "mockapp"
description = "Scripted UIA and MSAA/IA2 provider host for cross-process client-stack tests"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
verbatim-model.workspace = true
windows.workspace = true
windows-core.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
verbatim-core.workspace = true
verbatim-ia2.workspace = true
verbatim-outpost.workspace = true
verbatim-uia.workspace = true
verbatim-uia-rops.workspace = true

# The test binaries that use UIA as a client run through their own runner,
# which ends the process without running DLL detach code; the reason is in
# tests/common/harness.rs.
[[test]]
name = "arbitration"
harness = false

[[test]]
name = "call_counts"
harness = false

[[test]]
name = "caret_watch"
harness = false

# This one runs itself as a subprocess, which its own `main` recognizes.
[[test]]
name = "child_cleanup"
harness = false

[[test]]
name = "controller_for"
harness = false

[[test]]
name = "events"
harness = false

[[test]]
name = "focus_reports"
harness = false

[[test]]
name = "instruction_limit"
harness = false

[[test]]
name = "msaa_events"
harness = false

[[test]]
name = "msaa_tree"
harness = false

[[test]]
name = "native_controls"
harness = false

[[test]]
name = "remote_ops"
harness = false

[[test]]
name = "shutdown"
harness = false

[[test]]
name = "slow_application"
harness = false

[[test]]
name = "terminal"
harness = false

[[test]]
name = "text"
harness = false

[[test]]
name = "uia_tree"
harness = false

[[test]]
name = "window_names"
harness = false

[lints]
workspace = true
