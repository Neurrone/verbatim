# The determinism rule for the crates on a reducer's path
# (docs/design/logic-foundations.md, "Determinism"): no hash collection, no
# clock, no file, process, network, thread or environment, no trace id
# minted, and no floating-point function from the platform's library. Each
# covered crate keeps an identical copy of this file, which `cargo xtask ci`
# checks, since Clippy has no include.

disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order depends on a random seed: use a BTreeMap" },
    { path = "std::collections::HashSet", reason = "iteration order depends on a random seed: use a BTreeSet" },
    { path = "std::hash::RandomState", reason = "a random seed: use a BTreeMap or BTreeSet" },
    { path = "std::time::Instant", reason = "a clock: take the time as microseconds on the run's shared clock with the input" },
    { path = "std::time::SystemTime", reason = "a clock: take the time as microseconds on the run's shared clock with the input" },
    { path = "std::fs::File", reason = "a file read is a hidden input" },
    { path = "std::fs::OpenOptions", reason = "a file read is a hidden input" },
    { path = "std::fs::DirBuilder", reason = "a file system call is a hidden input" },
    { path = "std::fs::ReadDir", reason = "a file system read is a hidden input" },
    { path = "std::fs::DirEntry", reason = "a file system read is a hidden input" },
    { path = "std::fs::Metadata", reason = "a file system read is a hidden input" },
    { path = "std::process::Command", reason = "a process is a hidden input" },
    { path = "std::process::Child", reason = "a process is a hidden input" },
    { path = "std::net::TcpStream", reason = "the network is a hidden input" },
    { path = "std::net::TcpListener", reason = "the network is a hidden input" },
    { path = "std::net::UdpSocket", reason = "the network is a hidden input" },
    { path = "std::thread::Builder", reason = "a thread makes the result depend on scheduling" },
    { path = "std::thread::JoinHandle", reason = "a thread makes the result depend on scheduling" },
    { path = "std::thread::Thread", reason = "a thread makes the result depend on scheduling" },
]

disallowed-methods = [
    { path = "std::time::Instant::now", reason = "a clock: take the time as microseconds on the run's shared clock with the input" },
    { path = "std::time::Instant::elapsed", reason = "a clock read" },
    { path = "std::time::SystemTime::now", reason = "a clock read" },
    { path = "std::time::SystemTime::elapsed", reason = "a clock read" },
    { path = "std::time::SystemTime::duration_since", reason = "a clock value" },
    { path = "std::thread::spawn", reason = "a thread makes the result depend on scheduling" },
    { path = "std::thread::scope", reason = "a thread makes the result depend on scheduling" },
    { path = "std::thread::sleep", reason = "a wait is a hidden input" },
    { path = "std::thread::current", reason = "the thread is a hidden input" },
    { path = "std::thread::park", reason = "a wait is a hidden input" },
    { path = "std::thread::park_timeout", reason = "a wait is a hidden input" },
    { path = "std::thread::yield_now", reason = "scheduling is a hidden input" },
    { path = "std::thread::available_parallelism", reason = "the machine is a hidden input" },
    { path = "std::thread::panicking", reason = "the thread's state is a hidden input" },
    { path = "std::env::args", reason = "the environment is a hidden input" },
    { path = "std::env::args_os", reason = "the environment is a hidden input" },
    { path = "std::env::var", reason = "the environment is a hidden input" },
