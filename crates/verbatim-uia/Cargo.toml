[package]
name = "verbatim-uia"
description = "UIA client stack: event registration with cache requests, dedicated callback threads, and queries"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
tracing.workspace = true
verbatim-faults = { workspace = true, optional = true }
verbatim-model.workspace = true
verbatim-text.workspace = true
verbatim-win32.workspace = true
windows.workspace = true
windows-core.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
verbatim-faults.workspace = true
# The class verdict and acceptance test `follow_counts` judges a focus by,
# as the listener does.
verbatim-reader-rules.workspace = true

[features]
# The subscription's fault points, its observation point for a call ended
# by the connection timeout, and `subscribe::kept_for_tests`, for mockapp's
# `failure_paths` and `time_limits` tests; only `cargo xtask faults` turns
# it on.
faults = ["dep:verbatim-faults"]

[lints]
workspace = true
