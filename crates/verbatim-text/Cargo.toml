[package]
name = "verbatim-text"
description = "Platform-neutral text segmentation: characters as grapheme clusters, words and sentences by Unicode's rules with dictionaries, terminal cell widths"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
icu_locale_core.workspace = true
icu_normalizer.workspace = true
icu_properties.workspace = true
icu_segmenter.workspace = true
jieba-rs.workspace = true
serde = { workspace = true, optional = true }
unicode-width.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[features]
# Serialization of the terminal reading rules' state, for Core's state,
# which the flight recorder clones, compares and dumps.
serde = ["dep:serde"]

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
# Itself with its serialization, for the tests of the reader restored.
verbatim-text = { path = ".", features = ["serde"] }
verbatim-term-sim.workspace = true

[lints]
workspace = true
