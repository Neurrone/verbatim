[package]
name = "xtask"
description = "Workspace automation: cargo xtask ci, cargo xtask vm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Kept to workspace crates already compiled for other purposes, so the M2
# Hyper-V harness (`cargo xtask vm`) stays dependency-light: base64 and
# serde_json are already pulled in by verbatim-agent and verbatim-e2e, and
# verbatim-config lets `xtask vm deploy` stage settings.toml through the
# same ConfigStore the app itself uses, rather than hand-writing TOML.
# verbatim-agent and verbatim-control let `xtask vm test --record` speak
# the in-guest agent's own wire protocol directly (Hello, LaunchProcess,
# ProcessStatus, KillProcess) to launch and stop ffmpeg in the guest's
# interactive session — see xtask/src/vm/recording.rs. Depending on these
# two crates directly, rather than on verbatim-e2e's own `AgentClient`,
# avoids pulling a test-only crate into this binary for three request kinds.
# verbatim-e2e itself is now also a direct dependency (M3 Track B): `xtask
# vm test` reads the scenario registry (names, groups, artifact paths) to
# implement --scenario, --group, --list, and per-scenario recording and
# artifact collection, rather than duplicating that catalog here.
base64.workspace = true
serde_json.workspace = true
verbatim-agent.workspace = true
verbatim-config.workspace = true
verbatim-control.workspace = true
verbatim-e2e.workspace = true

[lints]
workspace = true
