[package]
name = "xtask"
description = "Workspace automation: cargo xtask ci, cargo xtask e2e, cargo xtask park, cargo xtask warm-speech, cargo xtask replay"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Every package depends on the generated workspace-hack crate
# (`cargo hakari manage-deps` requires it), so it stays unconditional.
workspace-hack = { version = "0.1", path = "../crates/workspace-hack" }
# The tier check reads `cargo metadata`'s JSON on every host.
serde_json.workspace = true

# Everything else is used only by the Windows-only commands, which
# `src/main.rs` gates on `cfg(windows)`; on any other host xtask builds only
# its portable part (`ci`, `docs` and `replay`).
[target.'cfg(windows)'.dependencies]
# verbatim-e2e is a direct dependency so that the commands that run,
# measure and group scenarios read the scenario registry and its artifact
# paths rather than a copy of them.
serde.workspace = true
verbatim-agent.workspace = true
verbatim-control.workspace = true
verbatim-e2e.workspace = true
verbatim-model.workspace = true
# The terminal conformance runner (`cargo xtask
# regenerate-terminal-conformance-expectations`) reads real terminals as
# Verbatim does, by the batches Core's terminal reader writes
# (verbatim-core), run as the outpost's worker runs a run of text steps
# (verbatim-outpost), and writes the simulated terminal's expectations. It
# fails a read whose log says a step was not read by its program (tracing).
tracing.workspace = true
verbatim-core.workspace = true
verbatim-outpost.workspace = true
verbatim-term-sim.workspace = true
verbatim-uia.workspace = true
# The OneCore speech binding, for `xtask warm-speech`.
windows.workspace = true

[lints]
workspace = true
